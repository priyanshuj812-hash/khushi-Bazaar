    <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khushi Bazaar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">🛍️ Khushi Bazaar</h1>
      <span class="text-xs bg-indigo-700 px-3 py-1 rounded-full text-indigo-100">Live Store</span>
    </div>
  </header>

  <!-- Main Banner -->
  <section class="bg-indigo-50 py-8 px-4 text-center border-b border-indigo-100">
    <h2 class="text-3xl font-extrabold text-indigo-900 mb-2">खुशी बाजार में आपका स्वागत है!</h2>
    <p id="category-banner-desc" class="text-gray-600 text-base max-w-2xl mx-auto">
      बेहतरीन क्वालिटी के प्रोडक्ट्स, सबसे कम दामों में। अपनी पसंदीदा कैटेगरी चुनें और ऑर्डर करें।
    </p>
  </section>

  <!-- Category Filter Bar -->
  <nav class="max-w-6xl mx-auto px-4 pt-6">
    <div class="flex items-center gap-2 overflow-x-auto pb-2" id="categories-container">
      <button onclick="filterCategory('All')" id="btn-All" class="cat-btn bg-indigo-600 text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm">
        सब देखें (All)
      </button>
    </div>
  </nav>

  <!-- Products Grid -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="mt-3 text-gray-500 font-medium">गूगल शीट से सामान लोड हो रहा है...</p>
    </div>

    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
      <!-- Dynamic Products Will Render Here -->
    </div>

    <div id="no-products" class="hidden text-center py-12 text-gray-500">
      इस कैटेगरी में अभी कोई सामान उपलब्ध नहीं है।
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-auto">
    <p>© Khushi Bazaar. Powered by Google Sheets.</p>
  </footer>

  <script>
    const SHEET_ID = '1lnPDL-dkaogbG7cQOsJNm8a_kysIUjEIUqlYTbvEl-Y';
    let allProducts = [];
    let categoryMap = {}; 
    let currentCategory = 'All';

    async function fetchGVizData(sheetName) {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
        const res = await fetch(url);
        const text = await res.text();
        const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
        if (!jsonMatch) return [];
        const data = JSON.parse(jsonMatch[1]);
        
        const cols = data.table.cols.map(c => c && c.label ? c.label.trim().toLowerCase() : '');
        const rows = data.table.rows || [];

        return rows.map(r => {
          let obj = {};
          r.c.forEach((cell, idx) => {
            const key = cols[idx] || `col_${idx}`;
            const val = cell ? (cell.v !== null && cell.v !== undefined ? cell.v : (cell.f || '')) : '';
            obj[key] = val;
            obj[`col_${idx}`] = val;
          });
          return obj;
        });
      } catch(e) {
        console.error('Fetch error:', e);
        return [];
      }
    }

    async function initStore() {
      document.getElementById('loading').classList.remove('hidden');
      
      let prodRows = await fetchGVizData('Sheet1');
      if (!prodRows.length) prodRows = await fetchGVizData('Products');
      
      let catRows = await fetchGVizData('Sheet2');
      if (!catRows.length) catRows = await fetchGVizData('Categories');

      // Process Categories
      catRows.forEach(row => {
        const catName = row.category || row.col_0 || '';
        const catDesc = row.categorydescription || row.description || row.col_1 || '';
        if (catName) {
          categoryMap[catName.toString().trim()] = catDesc.toString().trim();
        }
      });

      // Process Products
      allProducts = prodRows.map(row => {
        return {
          name: row.name || row.col_0 || 'Product',
          category: (row.category || row.col_1 || 'General').toString().trim(),
          price: row.price || row.col_2 || '0',
          image: row.image || row.img || row.col_3 || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400',
          description: row.description || row.desc || row.col_4 || '',
          phone: row.phone || row.mobile || row.col_5 || '919876543210'
        };
      }).filter(p => p.name && p.name.toLowerCase() !== 'name');

      renderCategories();
      renderProducts();
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('products-grid').classList.remove('hidden');
    }

    function renderCategories() {
      const catContainer = document.getElementById('categories-container');
      
      const uniqueCats = new Set(['All']);
      allProducts.forEach(p => { if(p.category) uniqueCats.add(p.category); });
      Object.keys(categoryMap).forEach(c => uniqueCats.add(c));

      let html = `<button onclick="filterCategory('All')" id="btn-All" class="cat-btn bg-indigo-600 text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm">सब देखें (All)</button>`;

      uniqueCats.forEach(cat => {
        if (cat !== 'All') {
          html += `<button onclick="filterCategory('${cat.replace(/'/g, "\\'")}')" id="btn-${cat}" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 border border-gray-200 px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm transition">${cat}</button>`;
        }
      });

      catContainer.innerHTML = html;
    }

    function filterCategory(catName) {
      currentCategory = catName;

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = 'cat-btn bg-white text-gray-700 hover:bg-gray-100 border border-gray-200 px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm transition';
      });
      const activeBtn = document.getElementById(`btn-${catName}`);
      if (activeBtn) {
        activeBtn.className = 'cat-btn bg-indigo-600 text-white px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap shadow-sm';
      }

      const bannerDesc = document.getElementById('category-banner-desc');
      if (catName === 'All') {
        bannerDesc.innerText = 'बेहतरीन क्वालिटी के प्रोडक्ट्स, सबसे कम दामों में। अपनी पसंदीदा कैटेगरी चुनें और ऑर्डर करें।';
      } else if (categoryMap[catName]) {
        bannerDesc.innerText = categoryMap[catName];
      } else {
        bannerDesc.innerText = `${catName} कैटेगरी के बेहतरीन प्रोडक्ट्स यहाँ देखें।`;
      }

      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      const noProds = document.getElementById('no-products');

      const filtered = currentCategory === 'All' 
        ? allProducts 
        : allProducts.filter(p => p.category.toLowerCase() === currentCategory.toLowerCase());

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        noProds.classList.remove('hidden');
        return;
      }

      noProds.classList.add('hidden');
      grid.classList.remove('hidden');

      grid.innerHTML = filtered.map(p => {
        const cleanPhone = String(p.phone).replace(/\D/g, '');
        const msg = encodeURIComponent(`नमस्ते! मैं Khushi Bazaar से "${p.name}" (मूल्य: ₹${p.price}) खरीदना चाहता/चाहती हूँ।`);
        const waUrl = `https://wa.me/${cleanPhone}?text=${msg}`;

        return `
          <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="relative mb-4">
                <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-contain rounded-xl" onerror="this.src='https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400'">
                <span class="absolute top-2 right-2 bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-1 rounded-full border border-indigo-200">${p.category}</span>
              </div>
              <h4 class="font-bold text-lg mb-1 text-gray-900">${p.name}</h4>
              <p class="text-sm text-gray-500 mb-3">${p.description}</p>
            </div>
            <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-50">
              <span class="text-xl font-bold text-indigo-600">₹${p.price}</span>
              <a href="${waUrl}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1 shadow-sm">
                💬 WhatsApp पर खरीदें
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    window.onload = initStore;
  </script>
</body>
</html>
