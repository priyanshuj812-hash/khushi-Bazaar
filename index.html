<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khushi Bazaar - आपकी अपनी किराना दुकान</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

  <!-- 🟢 हेडर (Header) -->
  <header class="sticky top-0 z-30 bg-indigo-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide">🛍️ Khushi Bazaar</h1>
        <p class="text-xs text-indigo-200">घर बैठे किराना मंगाएं</p>
      </div>
      <button onclick="toggleCartModal(true)" class="relative bg-indigo-700 hover:bg-indigo-800 p-2.5 rounded-full transition shadow-inner">
        🛒 <span id="cart-badge-count" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-indigo-600">0</span>
      </button>
    </div>
  </header>

  <!-- 🔍 सर्च बार (Search Bar) -->
  <div class="max-w-4xl mx-auto px-4 mt-4">
    <div class="relative">
      <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="सामान ढूँढें (जैसे: चीनी, साबुन, तेल)..." class="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
      <span class="absolute left-3.5 top-3.5 text-gray-400">🔍</span>
    </div>
  </div>

  <!-- 📦 प्रोडक्ट्स लिस्ट (Products Grid) -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <h2 class="font-bold text-gray-800 text-lg mb-3">हमारे प्रोडक्ट्स</h2>
    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <div class="col-span-full text-center py-10 text-gray-400">
         सामान लोड हो रहा है, कृपया प्रतीक्षा करें...
      </div>
    </div>
  </main>

  <!-- 🛒 नीचे की स्टिकी बार (Mobile Sticky Cart Bar) -->
  <div id="sticky-cart-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-20 px-4 py-3">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <p id="sticky-cart-items" class="text-xs text-gray-500 font-medium">0 सामान</p>
        <p id="sticky-cart-total" class="text-lg font-bold text-indigo-600">₹0</p>
      </div>
      <button onclick="toggleCartModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow text-sm flex items-center gap-2">
        कार्ट देखें 🛍️
      </button>
    </div>
  </div>

  <!-- 📋 कार्ट पॉपअप / मॉडल (Cart Modal) -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-end transition-opacity">
    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
      <div class="p-4 bg-indigo-600 text-white flex justify-between items-center">
        <h3 class="font-bold text-lg">आपकी कार्ट (Shopping Cart)</h3>
        <button onclick="toggleCartModal(false)" class="text-white text-2xl font-bold hover:text-gray-200">&times;</button>
      </div>

      <div id="cart-items-container" class="flex-1 overflow-y-auto p-4">
      </div>

      <div id="customer-form-section" class="p-4 border-t border-gray-100 bg-gray-50">
        <!-- 📍 दूरी चुनाव -->
        <div class="mb-3">
          <label class="block text-xs font-bold text-gray-700 mb-1">अपनी डिलीवरी दूरी / इलाका चुनें *</label>
          <select id="cust-zone" onchange="updateCartUI()" class="w-full p-2.5 bg-white text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-medium">
            <option value="1">1.5 KM के अंदर (लोकल बाज़ार / आसपास)</option>
            <option value="2">1.5 से 3 KM (मध्यम दूरी)</option>
            <option value="3">3 से 5 KM (बाहरी इलाका)</option>
          </select>
        </div>

        <div class="space-y-2 mb-3">
          <input type="text" id="cust-name" placeholder="आपका नाम *" class="w-full p-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
          <input type="tel" id="cust-phone" placeholder="मोबाइल नंबर *" class="w-full p-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
          
          <!-- 📍 जीपीएस लोकेशन ऑटो-डिटेक्ट बटन के साथ एड्रेस बॉक्स -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-bold text-gray-700">पूरा पता (Delivery Address) *</label>
              <button type="button" onclick="detectLocation()" class="text-[11px] bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded hover:bg-indigo-200 transition flex items-center gap-1">
                📍 वर्तमान लोकेशन भरें
              </button>
            </div>
            <textarea id="cust-address" rows="2" placeholder="मकान नं, गली, लैंडमार्क या ऊपर दिए बटन से जीपीएस लोकेशन लें *" class="w-full p-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white"></textarea>
          </div>
        </div>

        <div class="bg-white p-3 rounded-lg border border-gray-200 mb-3 space-y-1">
          <div class="flex justify-between text-xs text-gray-600">
            <span>सामान का मूल्य (Subtotal):</span>
            <span id="cart-subtotal" class="font-semibold">₹0</span>
          </div>
          <div class="flex justify-between text-xs text-gray-600">
            <span>डिलीवरी शुल्क:</span>
            <span id="delivery-info-text" class="font-semibold"></span>
          </div>
          <div class="flex justify-between items-center text-base pt-2 border-t border-gray-100 font-bold">
            <span class="text-gray-800">कुल बिल (Grand Total):</span>
            <span id="cart-grand-total" class="text-indigo-600 text-xl">₹0</span>
          </div>
        </div>

        <button id="whatsapp-order-btn" onclick="sendWhatsAppOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition">
          📲 व्हाट्सएप पर ऑर्डर भेजें
        </button>
      </div>
    </div>
  </div>

  <!-- ⚙️ जावास्क्रिप्ट लॉजिक -->
  <script>
    const SELLER_PHONE = "917970748217"; 
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwnEusIi7QKf2joA5_bbMc1yJwDiknfO7B3dYA0QahlvqebiI22bbDLfRAbSIiEZMeS/exec";

    const ZONE_RULES = {
      "1": { name: "1.5 KM के अंदर", minFree: 199, charge: 15 },
      "2": { name: "1.5 से 3 KM", minFree: 499, charge: 30 },
      "3": { name: "3 से 5 KM", minFree: 799, charge: 50 }
    };
    const ABSOLUTE_MIN_ORDER = 99; 

    let allProducts = [];
    let cart = {};

    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      try {
        if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL.trim() !== "") {
          const res = await fetch(GOOGLE_SHEET_URL);
          const rawData = await res.json();
          
          allProducts = rawData.map((p, index) => ({
            id: String(p.id || index + 1),
            name: p.name || "बिना नाम का सामान",
            price: Number(p.price) || 0,
            mrp: Number(p.mrp) || Number(p.price) || 0,
            image: p.image && String(p.image).startsWith('http') ? p.image : 'https://via.placeholder.com/150'
          }));
        } else {
          allProducts = [
            { id: "1", name: "ताज़ा अमूल दूध 1L", price: 66, mrp: 70, image: "https://via.placeholder.com/150" }
          ];
        }
        renderProducts(allProducts);
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center text-red-500 py-6">सामान लोड करने में समस्या आई। कृपया रिफ्रेश करें!</div>`;
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('product-grid');
      if (products.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-6">कोई सामान नहीं मिला!</div>`;
        return;
      }

      grid.innerHTML = products.map(p => {
        const discount = p.mrp && p.mrp > p.price ? Math.round(((p.mrp - p.price) / p.mrp) * 100) : 0;
        return `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between p-3 relative">
            ${discount > 0 ? `<span class="absolute top-2 left-2 bg-green-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">${discount}% OFF</span>` : ''}
            <img src="${p.image}" alt="${p.name}" class="w-full h-28 object-contain mb-2">
            <div>
              <h3 class="font-semibold text-xs sm:text-sm text-gray-800 line-clamp-2 mb-1">${p.name}</h3>
              <div class="flex items-baseline gap-1.5 mb-2">
                <span class="font-bold text-sm text-indigo-600">₹${p.price}</span>
                ${p.mrp > p.price ? `<span class="text-xs text-gray-400 line-through">₹${p.mrp}</span>` : ''}
              </div>
            </div>
            <button onclick="addToCart('${p.id}')" class="w-full bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white font-bold py-1.5 text-xs rounded-lg transition border border-indigo-200">
              + कार्ट में जोड़ें
            </button>
          </div>
        `;
      }).join('');
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    function addToCart(productId) {
      const product = allProducts.find(p => String(p.id) === String(productId));
      if (!product) return;

      if (cart[productId]) {
        cart[productId].qty += 1;
      } else {
        cart[productId] = { item: product, qty: 1 };
      }
      updateCartUI();
    }

    function changeQty(productId, delta) {
      if (!cart[productId]) return;
      cart[productId].qty += delta;
      if (cart[productId].qty <= 0) {
        delete cart[productId];
      }
      updateCartUI();
    }

    // 📍 GPS ऑटो-लोकेशन फ़ंक्शन
    function detectLocation() {
      if (!navigator.geolocation) {
        alert("आपका ब्राउज़र जीपीएस लोकेशन सपोर्ट नहीं करता है।");
        return;
      }
      
      const addressBox = document.getElementById('cust-address');
      addressBox.value = "लोकेशन खोजी जा रही है, कृपया प्रतीक्षा करें...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          try {
            // फ्री ओपन-सोर्स जियोकोडिंग सर्विस से सटीक पता मंगवाना
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
            const data = await response.json();
            if (data && data.display_name) {
              addressBox.value = data.display_name;
            } else {
              addressBox.value = `GPS Lat: ${lat}, Lon: ${lon} (सटीक पता नहीं मिला, कृपया मकान नंबर आदि जोड़ लें)`;
            }
          } catch (e) {
            addressBox.value = `GPS Location Coordinates: ${lat}, ${lon}`;
          }
        },
        (error) => {
          alert("लोकेशन एक्सेस करने की अनुमति नहीं मिली। कृपया अपने फोन की जीपीएस परमिशन ऑन करें।");
          addressBox.value = "";
        },
        { timeout: 10000, enableHighAccuracy: true }
      );
    }

    function updateCartUI() {
      const cartKeys = Object.keys(cart);
      let totalItems = 0;
      let subtotal = 0;

      cartKeys.forEach(key => {
        totalItems += cart[key].qty;
        subtotal += cart[key].qty * cart[key].item.price;
      });

      const zoneKey = document.getElementById('cust-zone') ? document.getElementById('cust-zone').value : "1";
      const currentRule = ZONE_RULES[zoneKey] || ZONE_RULES["1"];

      let deliveryFee = 0;
      if (subtotal > 0 && subtotal < currentRule.minFree) {
        deliveryFee = currentRule.charge;
      }
      let grandTotal = subtotal + deliveryFee;

      const badge = document.getElementById('cart-badge-count');
      if (totalItems > 0) {
        badge.innerText = totalItems;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      const stickyBar = document.getElementById('sticky-cart-bar');
      if (totalItems > 0) {
        stickyBar.classList.remove('hidden');
        document.getElementById('sticky-cart-items').innerText = `${totalItems} सामान कार्ट में`;
        document.getElementById('sticky-cart-total').innerText = `₹${grandTotal}`;
      } else {
        stickyBar.classList.add('hidden');
      }

      document.getElementById('cart-subtotal').innerText = `₹${subtotal}`;
      document.getElementById('cart-grand-total').innerText = `₹${grandTotal}`;

      const deliveryInfo = document.getElementById('delivery-info-text');
      if (subtotal >= currentRule.minFree) {
        deliveryInfo.innerHTML = `<span class="text-green-600 font-bold">फ्री (₹0)</span>`;
      } else if (subtotal > 0) {
        let diff = currentRule.minFree - subtotal;
        deliveryInfo.innerHTML = `<span class="text-orange-600 font-bold">+ ₹${currentRule.charge}</span> <br><span class="text-[10px] text-gray-500">(फ्री डिलीवरी के लिए ₹${diff} और जोड़ें)</span>`;
      } else {
        deliveryInfo.innerText = "₹0";
      }

      const container = document.getElementById('cart-items-container');
      const formSec = document.getElementById('customer-form-section');

      if (cartKeys.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-gray-400">
            <p class="text-4xl mb-2">🛒</p>
            <p class="font-semibold text-sm">आपकी कार्ट खाली है!</p>
          </div>
        `;
        formSec.classList.add('hidden');
      } else {
        formSec.classList.remove('hidden');
        container.innerHTML = cartKeys.map(key => {
          const c = cart[key];
          return `
            <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100">
              <div class="flex items-center gap-3">
                <img src="${c.item.image}" class="w-12 h-12 object-contain rounded border border-gray-100">
                <div>
                  <h5 class="font-bold text-xs text-gray-800">${c.item.name}</h5>
                  <p class="text-xs text-indigo-600 font-semibold">₹${c.item.price} × ${c.qty} = ₹${c.item.price * c.qty}</p>
                </div>
              </div>
              <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-lg">
                <button onclick="changeQty('${key}', -1)" class="w-6 h-6 bg-white rounded font-bold text-gray-700 text-xs">-</button>
                <span class="font-bold text-xs px-1">${c.qty}</span>
                <button onclick="changeQty('${key}', 1)" class="w-6 h-6 bg-indigo-600 text-white rounded font-bold text-xs">+</button>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function toggleCartModal(show) {
      const modal = document.getElementById('cart-modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    function sendWhatsAppOrder() {
      const cartKeys = Object.keys(cart);
      if (cartKeys.length === 0) return;

      let subtotal = 0;
      cartKeys.forEach(key => subtotal += cart[key].qty * cart[key].item.price);

      if (subtotal < ABSOLUTE_MIN_ORDER) {
        alert(`क्षमा करें! न्यूनतम ऑर्डर राशि ₹${ABSOLUTE_MIN_ORDER} होनी चाहिए। कृपया कुछ और सामान जोड़ें।`);
        return;
      }

      const zoneKey = document.getElementById('cust-zone').value;
      const currentRule = ZONE_RULES[zoneKey];
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();

      if (!name || !phone || !address) {
        alert("कृपया अपना नाम, मोबाइल नंबर और पूरा पता दर्ज करें!");
        return;
      }

      let deliveryFee = subtotal >= currentRule.minFree ? 0 : currentRule.charge;
      let grandTotal = subtotal + deliveryFee;

      let msg = `🛍️ *Khushi Bazaar - नया ऑर्डर*\n\n`;
      msg += `*👤 ग्राहक विवरण:*\n• नाम: ${name}\n• मोबाइल: ${phone}\n• दूरी/इलाका: ${currentRule.name}\n• पता: ${address}\n\n`;
      msg += `*📦 ऑर्डर की सूची:*\n`;

      cartKeys.forEach((key, idx) => {
        const item = cart[key].item;
        const qty = cart[key].qty;
        msg += `${idx + 1}. *${item.name}* (x${qty}) = ₹${item.price * qty}\n`;
      });

      msg += `\n-----------------------------------\n`;
      msg += `सामान का मूल्य: ₹${subtotal}\n`;
      msg += `डिलीवरी शुल्क (${currentRule.name}): ${deliveryFee === 0 ? 'FREE' : '₹' + deliveryFee}\n`;
      msg += `💰 *कुल बिल (Grand Total): ₹${grandTotal}*\n`;
      msg += `-----------------------------------\n\n`;
      msg += `कृपया मेरा ऑर्डर कन्फर्म करें। धन्यवाद!`;

      const cleanPhone = String(SELLER_PHONE).replace(/\D/g, '');
      const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
      window.open(waUrl, '_blank');
    }

    window.onload = loadProducts;
  </script>
</body>
</html>
