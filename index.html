<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khushi Bazaar</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24" onload="loadProducts()">

  <!-- 🟢 हेडर (Header) -->
  <header class="sticky top-0 z-30 bg-indigo-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-wide">🛍️ Khushi Bazaar</h1>
        <p class="text-[11px] text-indigo-200">घर बैठे किराना मंगाएं</p>
      </div>
      <button onclick="toggleCartModal(true)" class="relative bg-indigo-700 hover:bg-indigo-800 p-2.5 rounded-full transition shadow-inner">
        🛒 <span id="cart-badge-count" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-indigo-600">0</span>
      </button>
    </div>
  </header>

  <!-- 🔍 सर्च बार (Search Bar) -->
  <div class="max-w-4xl mx-auto px-4 mt-4">
    <div class="relative">
      <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="सामान ढूँढें (जैसे: चीनी, साबुन, तेल)..." class="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
      <span class="absolute left-3.5 top-3.5 text-gray-400">🔍</span>
    </div>
  </div>

  <!-- 🏷️ कैटेगरी फिल्टर टैब्स (Category Filter Tabs) -->
  <div class="max-w-4xl mx-auto px-4 mt-3">
    <div id="category-tabs" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filterByCategory('all')" class="cat-btn bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap shadow-sm transition">सभी सामान</button>
    </div>
  </div>

  <!-- 📦 प्रोडक्ट्स लिस्ट (Products Grid) -->
  <main class="max-w-4xl mx-auto px-4 mt-4">
    <h2 id="current-category-title" class="font-bold text-gray-800 text-base mb-3">सभी प्रोडक्ट्स</h2>
    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <div class="col-span-full text-center py-10 text-gray-400">
         सामान लोड हो रहा है, कृपया प्रतीक्षा करें...
      </div>
    </div>
  </main>

  <!-- 🛒 नीचे की स्टिकी बार (Mobile Sticky Cart Bar) -->
  <div id="sticky-cart-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-20 px-4 py-3">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <p id="sticky-cart-items" class="text-xs text-gray-500 font-medium">0 सामान</p>
        <p id="sticky-cart-total" class="text-lg font-bold text-indigo-600">₹0</p>
      </div>
      <button onclick="toggleCartModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow text-sm flex items-center gap-2">
        कार्ट देखें 🛍️
      </button>
    </div>
  </div>

  <!-- 📋 कार्ट पॉपअप / मॉडल (Cart Modal) -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-end transition-opacity">
    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
      <div class="p-4 bg-indigo-600 text-white flex justify-between items-center">
        <h3 class="font-bold text-lg">आपकी कार्ट (Shopping Cart)</h3>
        <button onclick="toggleCartModal(false)" class="text-white text-2xl font-bold hover:text-gray-200">×</button>
      </div>

      <div id="cart-items-container" class="flex-1 overflow-y-auto p-4">
      </div>

      <div id="customer-form-section" class="p-4 border-t border-gray-100 bg-gray-50">
        <div class="space-y-2 mb-3">
          <input type="text" id="cust-name" placeholder="आपका नाम *" class="w-full p-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
          <input type="tel" id="cust-phone" placeholder="मोबाइल नंबर *" class="w-full p-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
          <textarea id="cust-address" rows="2" placeholder="पूरा पता व लैंडमार्क (मकान नंबर/गली जरूर लिखें) *" class="w-full p-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white"></textarea>
        </div>

        <div class="bg-white p-3 rounded-lg border border-gray-200 mb-3 flex justify-between items-center font-bold text-base">
          <span class="text-gray-800">कुल बिल (Grand Total):</span>
          <span id="cart-grand-total" class="text-indigo-600 text-xl">₹0</span>
        </div>

        <button id="whatsapp-order-btn" onclick="sendWhatsAppOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition">
          📲 व्हाट्सएप पर ऑर्डर भेजें
        </button>
      </div>
    </div>
  </div>

  <!-- ⚙️ जावास्क्रिप्ट लॉजिक -->
  <script>
    const SELLER_PHONE = "917970748217"; 
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxgKi-caD30o0kMuTVr7zYJh0z8dgVg046r-bIao2PF8fw_CJ_YscJNa9rIIlSWJ5MW/exec";

    let allProducts = [];
    let currentCategory = 'all';
    let cart = {};

    function toggleCartModal(show) {
      const modal = document.getElementById('cart-modal');
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        const rawData = await res.json();
        
        allProducts = rawData.map((p, index) => ({
          id: String(p.id || index + 1),
          name: p.name ? `${p.name} ${p.description || ''}`.trim() : "बिना नाम का सामान",
          category: p.category ? String(p.category).trim() : "अन्य",
          price: Number(p.price) || 0,
          mrp: Number(p.mrp) || Number(p.price) || 0,
          image: p.image && String(p.image).startsWith('http') ? p.image : 'https://via.placeholder.com/150'
        }));

        buildCategoryTabs();
        renderProducts(allProducts);
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center text-red-500 py-6">सामान लोड करने में समस्या आई। कृपया रिफ्रेश करें!</div>`;
      }
    }

    function buildCategoryTabs() {
      const categories = ['all', ...new Set(allProducts.map(p => p.category))];
      const tabsContainer = document.getElementById('category-tabs');
      
      tabsContainer.innerHTML = categories.map(cat => {
        const displayName = cat === 'all' ? 'सभी सामान' : cat;
        const isActive = cat === currentCategory;
        return `
          <button onclick="filterByCategory('${cat}')" class="cat-btn ${isActive ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-gray-700 border border-gray-200'} text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap transition">
            ${displayName}
          </button>
        `;
      }).join('');
    }

    function filterByCategory(category) {
      currentCategory = category;
      buildCategoryTabs();
      
      document.getElementById('current-category-title').innerText = category === 'all' ? 'सभी प्रोडक्ट्स' : category;
      
      const query = document.getElementById('search-input').value.toLowerCase();
      applyFiltersAndSearch(query, category);
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      applyFiltersAndSearch(query, currentCategory);
    }

    function applyFiltersAndSearch(query, category) {
      let filtered = allProducts;
      if (category !== 'all') {
        filtered = filtered.filter(p => p.category === category);
      }
      if (query.trim() !== '') {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(query));
      }
      renderProducts(filtered);
    }

    function renderProducts(products) {
      const grid = document.getElementById('product-grid');
      if (products.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-6">कोई सामान नहीं मिला!</div>`;
        return;
      }

      grid.innerHTML = products.map(p => {
        const discount = p.mrp && p.mrp > p.price ? Math.round(((p.mrp - p.price) / p.mrp) * 100) : 0;
        return `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between p-3 relative">
            ${discount > 0 ? `<span class="absolute top-2 left-2 bg-green-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">${discount}% OFF</span>` : ''}
            <img src="${p.image}" alt="${p.name}" class="w-full h-28 object-contain mb-2">
            <div>
              <span class="text-[10px] text-indigo-500 font-semibold uppercase tracking-wider">${p.category}</span>
              <h3 class="font-semibold text-xs sm:text-sm text-gray-800 line-clamp-2 mb-1">${p.name}</h3>
              <div class="flex items-baseline gap-1.5 mb-2">
                <span class="font-bold text-sm text-indigo-600">₹${p.price}</span>
                ${p.mrp > p.price ? `<span class="text-xs text-gray-400 line-through">₹${p.mrp}</span>` : ''}
              </div>
            </div>
            <button onclick="addToCart('${p.id}')" class="w-full bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white font-bold py-1.5 text-xs rounded-lg transition border border-indigo-200">
              + कार्ट में जोड़ें
            </button>
          </div>
        `;
      }).join('');
    }

    function addToCart(productId) {
      const product = allProducts.find(p => String(p.id) === String(productId));
      if (!product) return;

      if (cart[productId]) {
        cart[productId].qty += 1;
      } else {
        cart[productId] = { item: product, qty: 1 };
      }
      updateCartUI();
    }

    function changeQty(productId, delta) {
      if (!cart[productId]) return;
      cart[productId].qty += delta;
      if (cart[productId].qty <= 0) {
        delete cart[productId];
      }
      updateCartUI();
    }

    function updateCartUI() {
      const cartKeys = Object.keys(cart);
      let totalItems = 0;
      let grandTotal = 0;

      cartKeys.forEach(key => {
        totalItems += cart[key].qty;
        grandTotal += cart[key].qty * cart[key].item.price;
      });

      const badge = document.getElementById('cart-badge-count');
      if (totalItems > 0) {
        badge.innerText = totalItems;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      const stickyBar = document.getElementById('sticky-cart-bar');
      if (totalItems > 0) {
        stickyBar.classList.remove('hidden');
        document.getElementById('sticky-cart-items').innerText = `${totalItems} सामान कार्ट में`;
        document.getElementById('sticky-cart-total').innerText = `₹${grandTotal}`;
      } else {
        stickyBar.classList.add('hidden');
      }

      document.getElementById('cart-grand-total').innerText = `₹${grandTotal}`;
      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      const cartKeys = Object.keys(cart);

      if (cartKeys.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-10">आपकी कार्ट खाली है!</div>`;
        return;
      }

      container.innerHTML = cartKeys.map(key => {
        const item = cart[key].item;
        const qty = cart[key].qty;
        return `
          <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg mb-2 border border-gray-100">
            <div class="flex-1 pr-2">
              <h4 class="font-semibold text-xs text-gray-800">${item.name}</h4>
              <p class="text-xs text-indigo-600 font-bold">₹${item.price} × ${qty} = ₹${item.price * qty}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="changeQty('${key}', -1)" class="w-6 h-6 bg-red-100 text-red-600 font-bold rounded flex items-center justify-center text-xs">-</button>
              <span class="text-xs font-bold w-4 text-center">${qty}</span>
              <button onclick="changeQty('${key}', 1)" class="w-6 h-6 bg-green-100 text-green-600 font-bold rounded flex items-center justify-center text-xs">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function sendWhatsAppOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();

      const cartKeys = Object.keys(cart);
      if (cartKeys.length === 0) {
        alert("आपकी कार्ट खाली है!");
        return;
      }

      if (!name || !phone || !address) {
        alert("कृपया अपना नाम, मोबाइल नंबर और पूरा पता लिखें!");
        return;
      }

      let grandTotal = 0;
      let orderText = `🛍️ *नया ऑर्डर - Khushi Bazaar*\n\n`;
      orderText += `👤 *ग्राहक का नाम:* ${name}\n`;
      orderText += `📞 *मोबाइल नंबर:* ${phone}\n`;
      orderText += `📍 *पता:* ${address}\n\n`;
      orderText += `🛒 *ऑर्डर किया सामान:*\n`;

      cartKeys.forEach((key, index) => {
        const item = cart[key].item;
        const qty = cart[key].qty;
        const itemTotal = item.price * qty;
        grandTotal += itemTotal;
        orderText += `${index + 1}. ${item.name} (${qty} x ₹${item.price}) = ₹${itemTotal}\n`;
      });

      orderText += `\n💰 *कुल बिल (Grand Total):* ₹${grandTotal}\n\n`;
      orderText += `धन्यवाद! कृपया ऑर्डर कन्फर्म करें।`;

      const encodedUrl = `https://wa.me/${SELLER_PHONE}?text=${encodeURIComponent(orderText)}`;
      window.open(encodedUrl, '_blank');
    }
  </script>
</body>
</html>
